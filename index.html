<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTMLテトリス 配布ページ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #0f0f13;
      color: #e8e8ed;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #1c1c24;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #9898a6;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .file-box {
      background: #16161d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .file-icon {
      width: 52px;
      height: 52px;
      background: #2a2a36;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .file-meta {
      font-size: 13px;
      color: #8888a0;
    }

    .download-btn {
      display: inline-block;
      background: #5e5ce6;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 50px;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(94, 92, 230, 0.35);
    }

    .download-btn:hover {
      background: #6e6cf0;
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(94, 92, 230, 0.45);
    }

    .howto {
      margin-top: 32px;
      text-align: left;
      background: #16161d;
      border-radius: 14px;
      padding: 20px 22px;
    }

    .howto h3 {
      font-size: 14px;
      color: #9898a6;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .howto ol {
      padding-left: 20px;
      font-size: 14px;
      color: #c8c8d4;
    }

    .howto li {
      margin-bottom: 6px;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #66667a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧱</div>
    <h1>HTMLテトリス</h1>
    <p class="subtitle">ブラウザだけで動くシンプルなテトリスです</p>

    <div class="file-box">
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name">tetris.html</div>
        <div class="file-meta">約 6 KB ・ 単体で動作</div>
      </div>
    </div>

    <a href="tetris.html" class="download-btn" download>ダウンロード</a>

    <div class="howto">
      <h3>遊び方</h3>
      <ol>
        <li>ダウンロードした <code>tetris.html</code> をダブルクリック</li>
        <li>ブラウザが開いたら <strong>Tキー</strong> でスタート</li>
        <li>← →：移動　↑：回転　↓：落下　スペース：即落下</li>
      </ol>
    </div>

    <p class="footer">インストール不要・オフラインでも遊べます</p>
  </div>
</body>
</html>
